---
name: Spellcheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    name: Spellcheck
    container:
      image: rocker/tidyverse:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Disable renv
        run: echo "RENV_CONFIG_AUTOLOADER_ENABLED=FALSE" >> $GITHUB_ENV

      - name: Run Spelling Check test
        if: ${{ hashFiles('DESCRIPTION') != '' }}
        uses: insightsengineering/r-spellcheck-action@v3.0.2

      - name: Skip package spellcheck when DESCRIPTION is missing
        if: ${{ hashFiles('DESCRIPTION') == '' }}
        run: echo "Skipping r-spellcheck-action because this repository is not an R package (no DESCRIPTION file)."
